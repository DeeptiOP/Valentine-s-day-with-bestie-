<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dipismita's Secret Valentine</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="floating-hearts"></div>

    <header>
        <h1>Happy Valentine's Day, Dipismita 💖</h1>
        <p>From your chaotic but loving bestie</p>
    </header>

    <main>

        <!-- LETTER SECTION -->
        <section class="card">
            <h2>A Special Message</h2>
            <p id="message">
                Dear Dipismita, Roses are red, violets are blue... 
                something suspicious is waiting for you.
            </p>

            <button id="reveal-btn">💕 Reveal Secret</button>

            <div id="prank">
                <p id="prank-text"></p>
                <!-- Prank image from images folder -->
                <img src="images/prank.jpg" alt="Funny Surprise" class="prank-img">
            </div>
        </section>

        <!-- GALLERY -->
        <section class="card">
            <h2>Some Memories</h2>
            <div class="gallery">
                <img src="images/pic1.jpg" alt="Memory 1">
                <img src="images/pic3.jpeg" alt="Memory 2">
                <img src="images/pic4.jpg" alt="Memory 3">
            </div>
        </section>

        <!-- CONFETTI -->
        <section class="card">
            <h2>Celebrate</h2>
            <button id="confetti-btn">🎉 Shower Confetti</button>
            <canvas id="confetti-canvas"></canvas>
        </section>

    </main>

    <footer>
        <p>Made with love and unnecessary drama ✨</p>
        <button id="prank-mode">Activate Chaos Mode</button>
        <button id="music-toggle">🎵 Play Music</button>
    </footer>

    <!-- Audio from audio folder -->
    <audio id="bg-music" loop>
        <source src="audio/song.mp3" type="audio/mpeg">
    </audio>

    <script src="script.js"></script>
</body>
</html>
