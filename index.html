<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultimate Chaos</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

/* ================= GLOBAL ================= */

*{
margin:0;
padding:0;
box-sizing:border-box;
scroll-behavior:smooth;
font-family:'Poppins',sans-serif;
}

body{
background:#000;
color:white;
overflow-x:hidden;
cursor:none;
transition:0.5s;
}

/* Romantic Background */

body::before{
content:"";
position:fixed;
inset:0;
background:url('bg.jpg') center/cover no-repeat;
z-index:-3;
filter:brightness(0.4);
}

/* Dark Overlay Gradient */

body::after{
content:"";
position:fixed;
inset:0;
background:linear-gradient(180deg,rgba(0,0,0,0.7),rgba(15,15,23,0.9));
z-index:-2;
}

/* ================= INTRO ================= */

.intro{
position:fixed;
inset:0;
background:black;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
z-index:9999;
animation:fadeOut 3s forwards 3s;
}

.intro h1{
font-size:clamp(2rem,6vw,4rem);
color:#ff2e63;
position:relative;
}

.glitch::before,
.glitch::after{
content:attr(data-text);
position:absolute;
left:0;
width:100%;
}

.glitch::before{
color:#00f2ff;
animation:glitch1 1s infinite;
}

.glitch::after{
color:#ff6ec7;
animation:glitch2 1s infinite;
}

@keyframes glitch1{
0%{clip-path:inset(0 0 70% 0);}
50%{clip-path:inset(20% 0 40% 0);}
100%{clip-path:inset(0 0 70% 0);}
}

@keyframes glitch2{
0%{clip-path:inset(60% 0 0 0);}
50%{clip-path:inset(40% 0 20% 0);}
100%{clip-path:inset(60% 0 0 0);}
}

@keyframes fadeOut{
to{opacity:0;visibility:hidden;}
}

/* ================= CURSOR ================= */

.cursor{
position:fixed;
width:15px;
height:15px;
border-radius:50%;
background:#ff2e63;
pointer-events:none;
z-index:99999;
box-shadow:0 0 20px #ff2e63,0 0 40px #ff6ec7;
}

.cursor-trail{
position:fixed;
width:35px;
height:35px;
border-radius:50%;
background:rgba(255,46,99,0.2);
pointer-events:none;
z-index:99998;
}

/* ================= HERO ================= */

.hero{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:2rem;
}

.hero h1{
font-size:clamp(2rem,5vw,3.5rem);
}

button{
margin-top:2rem;
padding:14px 32px;
border:none;
border-radius:40px;
background:linear-gradient(45deg,#ff2e63,#6c5ce7);
color:white;
font-size:1rem;
cursor:pointer;
transition:0.3s;
}

button:hover{
transform:scale(1.05);
}

/* ================= PRANK FULLSCREEN ================= */

.prank-container{
height:100vh;
position:relative;
overflow:hidden;
}

.prank-img{
position:absolute;
top:50%;
left:50%;
width:100vw;
height:100vh;
object-fit:cover;
transform:translate(-50%,-50%);
transition:transform 0.2s ease-out;
}

/* ================= PARTY MODE ================= */

.party-mode{
animation:flash 0.6s infinite alternate;
}

@keyframes flash{
0%{background:#ff2e63;}
50%{background:#6c5ce7;}
100%{background:#00f2ff;}
}

#party-message{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
font-size:clamp(2rem,6vw,4rem);
font-weight:700;
opacity:0;
z-index:100000;
}

#party-message.show{
opacity:1;
animation:bounce 1s infinite;
}

@keyframes bounce{
0%,100%{transform:translate(-50%,-50%) scale(1);}
50%{transform:translate(-50%,-50%) scale(1.3);}
}

/* Canvas Effects */

canvas{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
pointer-events:none;
z-index:10;
}

</style>
</head>

<body>

<div class="intro">
<h1 class="glitch" data-text="Hii Dipti...">Hii Dipti...</h1>
<p>Scroll down to see surprise 😈</p>
</div>

<canvas id="effects"></canvas>

<div class="cursor"></div>
<div class="cursor-trail"></div>

<section class="hero">
<h1>Ready for chaos?</h1>
<button onclick="activateParty()">Surprise 🎉</button>
<button onclick="revealSecret()">Reveal Secret 🤫</button>
</section>

<section class="prank-container">
<img src="prank.jpg" class="prank-img" id="prankImg">
</section>

<div id="party-message">Stay single forever like me 🤣🤣</div>

<audio id="music" src="party.mp3" loop></audio>

<script>

/* Cursor */
const cursor=document.querySelector(".cursor");
const trail=document.querySelector(".cursor-trail");

document.addEventListener("mousemove",e=>{
cursor.style.left=e.clientX+"px";
cursor.style.top=e.clientY+"px";
trail.style.left=e.clientX-10+"px";
trail.style.top=e.clientY-10+"px";
});

/* Scroll rotate image */
const prank=document.getElementById("prankImg");
window.addEventListener("scroll",()=>{
let rotate=window.scrollY*0.1;
prank.style.transform=`translate(-50%,-50%) rotate(${rotate}deg)`;
});

/* Canvas effects */
const canvas=document.getElementById("effects");
const ctx=canvas.getContext("2d");
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

function activateParty(){
document.body.classList.add("party-mode");
document.getElementById("party-message").classList.add("show");
document.getElementById("music").play();

for(let i=0;i<200;i++){
ctx.fillStyle=`hsl(${Math.random()*360},100%,50%)`;
ctx.fillRect(Math.random()*canvas.width,Math.random()*canvas.height,5,5);
}
}

function revealSecret(){
alert("You expected romance... but got full chaos 😂");
}

</script>

</body>
</html>
