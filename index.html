<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dipismita's Secret Valentine</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>

<body>

<canvas id="heart-canvas"></canvas>
<div class="cursor"></div>
<div class="cursor-trail"></div>
<div class="bg-animation"></div>

<header class="hero">
    <div class="hero-content">
        <h1>Happy Valentine's Day, Dipismita 💖</h1>
        <p>From your chaotic but loving bestie</p>
        <a href="#letter" class="scroll-btn">Scroll for Surprise ↓</a>
    </div>
</header>

<main class="container">

    <section id="letter" class="card reveal">
        <h2>A Special Message</h2>
        <p id="message">
            Dear Dipismita, roses are red, violets are blue...
            something dramatic is waiting for you.
        </p>

        <button id="reveal-btn">💕 Reveal Secret</button>

        <div id="prank">
            <p id="prank-text"></p>
            <img src="images/prank.jpg" class="prank-img">
        </div>
    </section>

    <section class="card reveal">
        <h2>Some Memories</h2>
        <div class="gallery">
            <img src="images/pic1.jpg">
            <img src="images/pic3.jpeg">
            <img src="images/pic4.jpg">
        </div>
    </section>

    <section class="card reveal">
        <h2>Special Surprise 🎉</h2>
        <button id="confetti-btn">Click for Magic</button>
        <canvas id="confetti"></canvas>
        <div id="single-message"></div>
    </section>

</main>

<footer>
    <p>Made with love and unnecessary drama ✨</p>
    <button id="chaos-btn">Activate Chaos Mode</button>
    <button id="music-btn">🎵 Play Music</button>
</footer>

<audio id="bg-music" loop>
    <source src="audio/song.mp3" type="audio/mpeg">
</audio>

<script src="script.js"></script>
</body>
</html>
